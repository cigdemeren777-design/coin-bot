<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Coin Bot • Sanal İşlemler</title><style>*{box-sizing:border-box}body{background:#0b1220;color:#eef3ff;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif;margin:0}main{max-width:700px;margin:auto;padding:22px 16px}h1{font-size:24px}.card{background:#162237;border:1px solid #314057;padding:18px;border-radius:15px;margin:12px 0}p{line-height:1.5}.muted{color:#a4b4cd}a{color:#9ebeff}button{padding:11px 16px;border:0;border-radius:10px;background:#3569e8;color:white}table{width:100%;border-collapse:collapse}td,th{padding:9px 3px;border-bottom:1px solid #34425b;text-align:left;font-size:13px}</style></head><body><main><a href="./">← Piyasa paneli</a><h1>Otomatik Sanal Coin Bot</h1><p class="muted">GitHub Actions • Saatlik kontrol • Gerçek emir yok</p><div class="card"><div id="status">Kayıt okunuyor…</div><p><button onclick="load()">Yenile</button></p></div><div class="card"><h2>Portföy</h2><div id="wallet">—</div></div><div class="card"><h2>Sinyaller</h2><div id="signals">—</div></div><div class="card"><h2>Son işlemler</h2><div id="trades">—</div></div><p class="muted">Bu panel kayıt dosyasını gösterir; veri gecikebilir. Botun çalıştığına dair tek başına garanti değildir. İşlem ve kâr sonuçları sanaldır.</p></main><script>
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('./bot_state.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Henüz durum dosyası yok (HTTP '+r.status+')');const s=await r.json();if(s.mode!=='paper')throw Error('Güvenli olmayan mod');const updated=Date.parse(s.updated_at);const stale=!Number.isFinite(updated)||Date.now()-updated>2.5*3600000;document.getElementById('status').textContent=(stale?'⚠️ Kayıt güncel değil':'● Son kayıt alındı')+' • '+(s.updated_at||'bilinmiyor');document.getElementById('wallet').textContent='Nakit: '+Number(s.cash_usdt).toFixed(2)+' USDT • Açık sanal işlem: '+Object.keys(s.positions||{}).length;document.getElementById('signals').innerHTML=Object.entries(s.signals||{}).map(([symbol,x])=>'<p>'+esc(symbol)+': '+esc(x.signal)+' • '+Number(x.price).toFixed(2)+' USDT</p>').join('')||'Sinyal yok';document.getElementById('trades').innerHTML='<table><tr><th>Parite</th><th>İşlem</th><th>Fiyat</th></tr>'+[...(s.history||[])].reverse().slice(0,12).map(x=>'<tr><td>'+esc(x.symbol)+'</td><td>'+esc(x.action)+'</td><td>'+Number(x.price).toFixed(2)+'</td></tr>').join('')+'</table>';}catch(e){document.getElementById('status').textContent='⚠️ '+e.message;}}load();setInterval(load,60000);
</script></body></html>
